# Continuous integration for the Speak It monorepo.
#
# Linux jobs run on every push to main and every pull request. The iOS job is
# the expensive one: GitHub bills macOS at ten times the Linux rate, and this
# private repository's Free-plan allowance covers roughly one unit-suite run a
# month there. So the iOS job runs on GitHub-hosted macOS only when dispatched
# by hand, and on every pull request once the repository variable IOS_RUNNER
# names a self-hosted Mac (see CONTRIBUTING.md).
#
# The language job is the cheap half of that: the corpus gate and every
# language scorer, with no simulator and no release build. It exists because
# the parser only runs on macOS, so a session without a Mac would otherwise be
# changing language rules against numbers it cannot produce. Dispatch it with
# language_only to get those numbers without paying for the unit suite. It is
# dispatch-only for now — see the job for why.
#
# Every check is a script under Tools/CI so the same command runs locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: "runs-on label for the iOS job (blank = IOS_RUNNER variable, else macos-26)"
        type: string
        default: ""
      release_build:
        description: "Also compile the Release configuration for a generic iOS device"
        type: boolean
        default: false
      ui_tests:
        description: "Also run the XCUITest suite (slow)"
        type: boolean
        default: false
      language_only:
        description: "Only measure language: skip the unit suite and the release build"
        type: boolean
        default: false
      devset_failures:
        description: "Also print every development-set failure (never the held-out ones)"
        type: boolean
        default: false
      tests:
        description: "Which tests to run (e.g. SpeakItTests/ObligationFrameTests). Blank = the whole unit suite"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read  # paths-filter lists a pull request's files through the API
    outputs:
      ios: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ios == 'true' }}
      dashboard: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.dashboard == 'true' }}
      referral: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.referral == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            ios:
              - 'SpeakIt/**'
              - 'SpeakItTests/**'
              - 'SpeakItUITests/**'
              - 'SpeakItLiveActivity/**'
              - 'SpeakItShareExtension/**'
              - 'Shared/**'
              - 'SpeakIt.xcodeproj/**'
              - 'Tools/CorpusRunner/**'
              - 'Tools/LanguageMutations/**'
              - 'Tools/PipelineProbe/**'
              - 'Tools/CI/**'
              - '.github/workflows/ci.yml'
            dashboard:
              - 'FounderDashboard/**'
              - '.github/workflows/ci.yml'
            referral:
              - 'ReferralService/**'
              - '.github/workflows/ci.yml'

  hygiene:
    name: Secrets, workflow and shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan the full history for committed secrets
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo" -w /repo \
            "ghcr.io/gitleaks/gitleaks:${GITLEAKS_VERSION}" \
            git --redact --verbose --exit-code 1 --config .gitleaks.toml /repo
        env:
          GITLEAKS_VERSION: "v8.30.1"
      - name: Lint the workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Lint the shell scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./Tools
          severity: warning

  language-tools:
    name: Language tooling (no Mac needed)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The mutation generator and its reporter are pure Python, so the half of
      # the language tooling that does not link NaturalLanguage is checked on
      # every pull request rather than waiting for a Mac.
      - name: Mutation generator and reporter
        working-directory: Tools/LanguageMutations
        run: python3 -m unittest discover -v
      - name: Corpus scorer self-tests
        run: python3 Tools/CorpusRunner/test_score.py
      # The everyday scorer's own tests are pure Python too. They ran only
      # inside the macOS corpus gate, which meant a scorer defect waited for a
      # Mac to be noticed and cost a macOS minute to find.
      - name: Everyday scorer self-tests
        run: python3 Tools/CorpusRunner/everyday/test_score.py
      - name: Everyday held-out leak check
        run: python3 Tools/CorpusRunner/everyday/leak-check.py

  dashboard:
    name: Founder dashboard
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: FounderDashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: FounderDashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test

  referral-service:
    name: Referral service
    needs: changes
    if: needs.changes.outputs.referral == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ReferralService
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ReferralService/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test

  ios:
    name: iOS app
    needs: changes
    # GitHub-hosted macOS only when asked for by hand; a self-hosted Mac on
    # every change. See the header comment for the cost reasoning.
    if: >-
      needs.changes.outputs.ios == 'true' &&
      inputs.language_only != true &&
      (github.event_name == 'workflow_dispatch' || vars.IOS_RUNNER != '')
    runs-on: ${{ inputs.runner || vars.IOS_RUNNER || 'macos-26' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.6 on a GitHub-hosted image
        if: runner.environment == 'github-hosted'
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Show the toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Corpus gate (rules path, no simulator)
        run: Tools/CI/corpus-gate.sh

      # A stock simulator holds ~3.7 GB; the SimSlim profile in Tools/CI cuts
      # it to ~0.9 GB, which is the difference between one simulator and
      # several on a 16 GB self-hosted Mac. Opt-in: the step is a no-op when
      # SimSlim is not installed on the runner (brew install mobai-app/tap/simslim).
      - name: Prepare a slim simulator when SimSlim is installed
        run: |
          if command -v simslim >/dev/null 2>&1; then
            udid="$(Tools/CI/simulator-pool.sh 1 | tail -n 1)"
            echo "SPEAKIT_SIMULATOR_ID=$udid" >> "$GITHUB_ENV"
          else
            echo "simslim not installed; the unit tests run on a stock simulator"
          fi

      # A macOS minute costs ten Linux minutes, and the whole suite is twenty
      # of them. Naming one class turns a diagnosis that used to cost a run
      # into one that costs a build.
      - name: Unit tests
        run: Tools/CI/unit-tests.sh "${{ inputs.tests || 'SpeakItTests' }}"
        env:
          SPEAKIT_DERIVED_DATA: ${{ runner.temp }}/DerivedData
          SPEAKIT_RESULT_BUNDLE: ${{ runner.temp }}/SpeakItTests.xcresult

      - name: Upload the unit-test result bundle
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SpeakItTests.xcresult
          path: ${{ runner.temp }}/SpeakItTests.xcresult
          retention-days: 7
          if-no-files-found: ignore

      - name: Release compile check
        if: inputs.release_build == true || github.ref == 'refs/heads/main'
        run: Tools/CI/release-build.sh
        env:
          SPEAKIT_RELEASE_DERIVED_DATA: ${{ runner.temp }}/DerivedDataRelease

      - name: UI tests
        if: inputs.ui_tests == true
        run: Tools/CI/unit-tests.sh SpeakItUITests
        env:
          SPEAKIT_DERIVED_DATA: ${{ runner.temp }}/DerivedData
          SPEAKIT_RESULT_BUNDLE: ${{ runner.temp }}/SpeakItUITests.xcresult

      - name: Upload the UI-test result bundle
        if: failure() && inputs.ui_tests == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SpeakItUITests.xcresult
          path: ${{ runner.temp }}/SpeakItUITests.xcresult
          retention-days: 7
          if-no-files-found: ignore

  language:
    name: Language metrics
    # Dispatch only, deliberately, until one real run on a Mac has confirmed
    # the runtime, the cost, the output format and that every scorer works.
    # Running it per pull request is the intended end state and is one line
    # away — add `|| vars.IOS_RUNNER != ''` — but automating a job nobody has
    # watched succeed is how a green tick starts meaning nothing.
    #
    # It repeats the iOS job's corpus gate on a full dispatch; ninety seconds
    # is the right price for the gate not depending on this job existing.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner || vars.IOS_RUNNER || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.6 on a GitHub-hosted image
        if: runner.environment == 'github-hosted'
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"

      # Gating corpus, the four development sets and the held-out set. The
      # held-out set is scored non-verbose and the script refuses --verbose,
      # so a CI run can never be the thing that unseals it.
      - name: Measure
        run: Tools/CI/language-metrics.sh --report "${{ runner.temp }}/language-metrics.txt"

      # The development sets are meant to be read; the held-out sets are not.
      # This step prints the first and cannot reach the second: the scorers are
      # named in the script rather than discovered, and it refuses arguments.
      - name: Development-set failures
        if: inputs.devset_failures == true
        run: Tools/CI/devset-failures.sh > "${{ runner.temp }}/devset-failures.txt" 2>&1 || true

      - name: Upload the metrics report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: language-metrics
          path: ${{ runner.temp }}/language-metrics.txt
          retention-days: 30
          if-no-files-found: ignore
