# Continuous integration for the Speak It monorepo.
#
# Linux jobs run on every push to main and every pull request. The iOS job is
# the expensive one: GitHub bills macOS at ten times the Linux rate, and this
# private repository's Free-plan allowance covers roughly one unit-suite run a
# month there. So the iOS job runs on GitHub-hosted macOS only when dispatched
# by hand, and on every pull request once the repository variable IOS_RUNNER
# names a self-hosted Mac (see CONTRIBUTING.md).
#
# The language job is the cheap half of that: the corpus gate and every
# language scorer, with no simulator and no release build. It exists because
# the parser only runs on macOS, so a session without a Mac would otherwise be
# changing language rules against numbers it cannot produce. Dispatch it with
# language_only to get those numbers without paying for the unit suite. It is
# dispatch-only for now — see the job for why.
#
# Every check is a script under Tools/CI so the same command runs locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: "runs-on label for the iOS job (blank = IOS_RUNNER variable, else macos-26)"
        type: string
        default: ""
      release_build:
        description: "Also compile the Release configuration for a generic iOS device"
        type: boolean
        default: false
      ui_tests:
        description: "Also run the XCUITest suite (slow)"
        type: boolean
        default: false
      language_only:
        description: "Only measure language: skip the unit suite and the release build"
        type: boolean
        default: false
      devset_failures:
        description: "Also print every development-set failure (never the held-out ones)"
        type: boolean
        default: false
      tests:
        description: "Which tests to run (e.g. SpeakItTests/ObligationFrameTests). Blank = the whole unit suite"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read  # paths-filter lists a pull request's files through the API
    outputs:
      ios: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ios == 'true' }}
      dashboard: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.dashboard == 'true' }}
      referral: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.referral == 'true' }}
      prose: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.prose == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            ios:
              - 'SpeakIt/**'
              - 'SpeakItTests/**'
              - 'SpeakItUITests/**'
              - 'SpeakItLiveActivity/**'
              - 'SpeakItShareExtension/**'
              - 'Shared/**'
              - 'SpeakIt.xcodeproj/**'
              - 'Tools/CorpusRunner/**'
              - 'Tools/LanguageMutations/**'
              - 'Tools/PipelineProbe/**'
              - 'Tools/InterpretationProbe/**'
              - 'Tools/CI/**'
              - '.github/workflows/ci.yml'
            # The leak check walks EVERY Markdown file in the repository, not
            # only the ones under Docs/, because a README beside a corpus is
            # the more tempting place to quote a capture. It was reachable
            # only through the `ios` filter, whose globs contain no Markdown
            # at all -- so a documentation-only pull request ran no sealed-set
            # check. #56 nearly put a held-out capture verbatim into
            # LANGUAGE_BASELINE.md and was caught by a reader, not by CI.
            #
            # This is its own output rather than another glob under `ios`
            # because `ios` also gates the macOS job, and a prose change must
            # not bill a Mac. Kept as `**/*.md` rather than `Docs/**` to match
            # what the check actually reads; test_score.py fails when a file
            # the check reads is matched by none of these globs.
            #
            # The device-baseline receipt check and everything it reads are
            # here rather than under `ios` for the same reason: `ios` bills a
            # Mac, and a pull request editing a few JSON files must not.
            #
            # All THREE inputs need a glob, which is the part that was missed
            # twice. The check reads the device-baseline manifest and receipt,
            # and Candidate47's frozen manifest plus the two records pinning
            # its hash. An edit to any of them changes the verdict, so an edit
            # to any of them has to start the job -- otherwise the check that
            # detects the tampering never runs on the commit that does it.
            # Candidate47/ is taken whole rather than file by file: everything
            # under it is frozen, so a glob deliberately wider than what the
            # check reads costs one cheap Linux job and removes the next
            # version of this question.
            prose:
              - '**/*.md'
              - 'Docs/Understanding/DeviceBaseline/**'
              - 'Docs/Understanding/Candidate47/**'
              - 'Tools/Reliability250K/**'
              - '.github/workflows/ci.yml'
            dashboard:
              - 'FounderDashboard/**'
              - '.github/workflows/ci.yml'
            referral:
              - 'ReferralService/**'
              - '.github/workflows/ci.yml'

      # The iOS job does not run on a pull request until IOS_RUNNER names a
      # Mac, and a job that did not run renders grey, not red. Pull requests
      # have gone green with no Swift compiled and been read as building. This
      # puts the gap on the checks page in words.
      - name: Say when Swift changed and none will be compiled
        if: ${{ github.event_name == 'pull_request' && steps.filter.outputs.ios == 'true' && vars.IOS_RUNNER == '' }}
        run: |
          echo "::warning title=No Swift compiled on this pull request::Files under the iOS filter changed, and the iOS job runs on pull requests only when IOS_RUNNER is set. The green checks here are Linux checks and say nothing about whether the app builds. Dispatch ci.yml on this branch to compile it."

      # The dispatch half of the same gap. language_only skips the iOS job, and
      # an absent job says nothing; a reader asking "did it compile?" should get
      # "no" in words. The language job builds the command-line corpus tools
      # from a subset of the app's sources, which is not the app, its
      # extensions or its tests.
      - name: Say when a language-only dispatch compiles no app
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.language_only == true }}
        run: |
          message="language_only dispatch: the iOS job did not run, so the app, its extensions and its test bundles were NOT compiled and no unit, Release or UI test ran. The language job's numbers say nothing about whether the app builds."
          echo "::warning title=No app Swift compiled on this dispatch::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"

  hygiene:
    name: Secrets, workflow and shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan the full history for committed secrets
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo" -w /repo \
            "ghcr.io/gitleaks/gitleaks:${GITLEAKS_VERSION}" \
            git --redact --verbose --exit-code 1 --config .gitleaks.toml /repo
        env:
          GITLEAKS_VERSION: "v8.30.1"
      - name: Lint the workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Lint the shell scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./Tools
          severity: warning

  language-tools:
    name: Language tooling (no Mac needed)
    needs: changes
    if: needs.changes.outputs.ios == 'true' || needs.changes.outputs.prose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The mutation generator and its reporter are pure Python, so the half of
      # the language tooling that does not link NaturalLanguage is checked on
      # every pull request rather than waiting for a Mac.
      - name: Mutation generator and reporter
        working-directory: Tools/LanguageMutations
        run: python3 -m unittest discover -v
      - name: Corpus scorer self-tests
        run: python3 Tools/CorpusRunner/test_score.py
      # Named here rather than discovered: `unittest discover` will not descend
      # into `everyday/`, which has no `__init__.py`, so a discovery step would
      # quietly stop covering half of this. The list being hand-written is why
      # test_score.py asserts every `test_*.py` under Tools/CorpusRunner/
      # appears in this file -- a suite nobody runs reports nothing, cleanly.
      - name: Choice-family balance checker self-tests
        run: python3 Tools/CorpusRunner/test_choice_balance.py
      - name: Per-connector report self-tests
        run: python3 Tools/CorpusRunner/consequence/test_block_report.py
      - name: Connective census self-tests
        run: python3 Tools/CorpusRunner/test_connective_census.py
      # The population figures in LANGUAGE_BASELINE.md are generated from the
      # corpus walk rather than typed, and this is what notices when the two
      # disagree. It has to run on a pull request that touches no Python at
      # all: the gating corpus is two thirds of that population, so a change
      # adding three test strings moves every figure in the section while
      # touching nothing under this directory.
      - name: Baseline population figures match the corpus
        run: python3 Tools/CorpusRunner/test_baseline_figures.py
      # The second question a target has to survive, after the census's "is
      # this form attested": are the N rows carrying it N observations, or one
      # frame written N times? Two proposals were stopped by asking it by hand
      # on 2026-09-14 and nothing checked it.
      - name: Observation-shape measure self-tests
        run: python3 Tools/CorpusRunner/test_observation.py
      # These three were reachable only through corpus-gate.sh, which needs a
      # Swift toolchain and so runs on a Mac by dispatch. That left the leak
      # check -- the mechanical part of the held-out boundary -- never running
      # on a pull request, which is the one place a leak is introduced. All
      # three are pure Python and take about twenty seconds together.
      # Five lists in four files say "this is an obligation" and they agree on
      # five forms of the thirty-eight between them. Converging them changes
      # `count` and `route`, so it waits for its own measurement pass; what
      # runs here is the half that needs no judgement -- a single-token form
      # missing from the clause splitter gets cut off from what it governs,
      # which is how "I hafta drop the car off" filed a note titled "I hafta".
      - name: Obligation vocabularies agree where they must
        run: python3 Tools/CorpusRunner/test_parser_vocabulary.py
      - name: Held-out scorer self-tests (carries the leak check)
        run: python3 Tools/CorpusRunner/everyday/test_score.py
      - name: Held-out boundary
        run: python3 Tools/CorpusRunner/everyday/leak-check.py
      - name: Every measure is protected by its suite
        run: python3 Tools/CorpusRunner/everyday/measure-gate.py
      # Beside the leak check rather than in the corpus gate, for the reason
      # the leak check moved here: the gate needs a Mac and is dispatch-only,
      # so a guard living there does not run on the pull request that
      # introduces the edit it exists to catch.
      - name: Every sealed measure that moved is in the cost ledger
        run: python3 Tools/CorpusRunner/ledger-check.py
      - name: No sealed capture was edited after it was scored
        run: python3 Tools/CorpusRunner/everyday/generation-check.py
      # The Foundation Models interpretation path may be pointed at a sealed
      # set, and a set that has been sent to somebody's server cannot be made
      # unseen again -- there is no red build that undoes it. Both rules it
      # depends on are properties of the source text, so they are checked here,
      # on Linux, on every pull request, rather than on a Mac by dispatch.
      - name: The interpretation path is on-device only
        run: python3 Tools/CorpusRunner/test_interpretation_isolation.py
      # Receipt-only: compares the device-baseline manifest with Candidate47's
      # and the receipt with both. Three frozen files, no working tree, so this
      # cannot redden when main legitimately moves. It catches the one mistake
      # that is otherwise silent -- somebody regenerates the manifest after
      # landing a change and leaves the receipt claiming two deviations. It does
      # NOT check that any checkout matches the manifest; that is the full run,
      # which pins a tree and is deliberately not here.
      - name: The device-baseline receipt agrees with its manifests
        run: python3 Tools/Reliability250K/verify_device_baseline.py --receipt-only

  dashboard:
    name: Founder dashboard
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: FounderDashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: FounderDashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test

  referral-service:
    name: Referral service
    needs: changes
    if: needs.changes.outputs.referral == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ReferralService
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ReferralService/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test

  ios:
    name: iOS app
    needs: changes
    # GitHub-hosted macOS only when asked for by hand; a self-hosted Mac on
    # every change. See the header comment for the cost reasoning.
    if: >-
      needs.changes.outputs.ios == 'true' &&
      inputs.language_only != true &&
      (github.event_name == 'workflow_dispatch' || vars.IOS_RUNNER != '')
    runs-on: ${{ inputs.runner || vars.IOS_RUNNER || 'macos-26' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.6 on a GitHub-hosted image
        if: runner.environment == 'github-hosted'
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Show the toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      # Every step after this one runs whatever the gate says, and the job
      # still fails if the gate failed. A red gate used to stop the job here,
      # so the dispatch that was meant to compile a branch reported one
      # blocking corpus row and nothing about the Swift. Each stage now
      # answers for itself in the summary at the end.
      - name: Corpus gate (rules path, no simulator)
        id: gate
        run: Tools/CI/corpus-gate.sh

      # A stock simulator holds ~3.7 GB; the SimSlim profile in Tools/CI cuts
      # it to ~0.9 GB, which is the difference between one simulator and
      # several on a 16 GB self-hosted Mac. Opt-in: the step is a no-op when
      # SimSlim is not installed on the runner (brew install mobai-app/tap/simslim).
      - name: Prepare a slim simulator when SimSlim is installed
        if: ${{ !cancelled() }}
        run: |
          if command -v simslim >/dev/null 2>&1; then
            udid="$(Tools/CI/simulator-pool.sh 1 | tail -n 1)"
            echo "SPEAKIT_SIMULATOR_ID=$udid" >> "$GITHUB_ENV"
          else
            echo "simslim not installed; the unit tests run on a stock simulator"
          fi

      # Compiling is its own step so that "the Swift compiled" is an answer
      # this job gives, rather than something inferred from a test run.
      - name: Compile the app and test bundles
        id: compile
        if: ${{ !cancelled() }}
        run: Tools/CI/compile.sh
        env:
          SPEAKIT_DERIVED_DATA: ${{ runner.temp }}/DerivedData

      # A macOS minute costs ten Linux minutes, and the whole suite is twenty
      # of them. Naming one class turns a diagnosis that used to cost a run
      # into one that costs a build.
      - name: Unit tests
        id: unit
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: Tools/CI/unit-tests.sh "${{ inputs.tests || 'SpeakItTests' }}"
        env:
          SPEAKIT_DERIVED_DATA: ${{ runner.temp }}/DerivedData
          SPEAKIT_RESULT_BUNDLE: ${{ runner.temp }}/SpeakItTests.xcresult

      - name: Upload the unit-test result bundle
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SpeakItTests.xcresult
          path: ${{ runner.temp }}/SpeakItTests.xcresult
          retention-days: 7
          if-no-files-found: ignore

      # Deliberately not gated on the compile step above, unlike the tests:
      # it is its own build (Release configuration, generic iOS device, its own
      # derived data), so it answers its own question even when the simulator
      # compile failed. A FAIL beside a PASS here means the Release build
      # passed and the simulator build did not; it does not mean "it builds".
      - name: Release compile check
        id: release
        if: ${{ !cancelled() && (inputs.release_build == true || github.ref == 'refs/heads/main') }}
        run: Tools/CI/release-build.sh
        env:
          SPEAKIT_RELEASE_DERIVED_DATA: ${{ runner.temp }}/DerivedDataRelease

      - name: UI tests
        id: ui
        if: ${{ !cancelled() && inputs.ui_tests == true && steps.compile.outcome == 'success' }}
        run: Tools/CI/unit-tests.sh SpeakItUITests
        env:
          SPEAKIT_DERIVED_DATA: ${{ runner.temp }}/DerivedData
          SPEAKIT_RESULT_BUNDLE: ${{ runner.temp }}/SpeakItUITests.xcresult

      - name: Upload the UI-test result bundle
        if: failure() && inputs.ui_tests == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SpeakItUITests.xcresult
          path: ${{ runner.temp }}/SpeakItUITests.xcresult
          retention-days: 7
          if-no-files-found: ignore

      # One line per stage, each with its own outcome. `skipped` means the
      # stage did not run, and is printed as NOT RUN so that it can never be
      # read as a pass. The unit-test row names what was selected, because a
      # green focused run is not a green suite, and carries the passed, failed
      # and skipped counts unit-tests.sh read from the result bundle, because
      # one word cannot say which failures were the diagnostic's.
      - name: What this run established
        if: ${{ always() }}
        env:
          GATE: ${{ steps.gate.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          SELECTION: ${{ inputs.tests || 'SpeakItTests' }}
          UNIT_PASSED: ${{ steps.unit.outputs.passed }}
          UNIT_FAILED: ${{ steps.unit.outputs.failed }}
          UNIT_SKIPPED: ${{ steps.unit.outputs.skipped }}
          RELEASE: ${{ steps.release.outcome }}
          UI: ${{ steps.ui.outcome }}
          UI_PASSED: ${{ steps.ui.outputs.passed }}
          UI_FAILED: ${{ steps.ui.outputs.failed }}
          UI_SKIPPED: ${{ steps.ui.outputs.skipped }}
        run: Tools/CI/stage-summary.sh

  language:
    name: Language metrics
    # Dispatch only, deliberately, until one real run on a Mac has confirmed
    # the runtime, the cost, the output format and that every scorer works.
    # Running it per pull request is the intended end state and is one line
    # away — add `|| vars.IOS_RUNNER != ''` — but automating a job nobody has
    # watched succeed is how a green tick starts meaning nothing.
    #
    # It repeats the iOS job's corpus gate on a full dispatch; ninety seconds
    # is the right price for the gate not depending on this job existing.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner || vars.IOS_RUNNER || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.6 on a GitHub-hosted image
        if: runner.environment == 'github-hosted'
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"

      # Gating corpus, the four development sets and the held-out set. The
      # held-out set is scored non-verbose and the script refuses --verbose,
      # so a CI run can never be the thing that unseals it.
      - name: Measure
        run: Tools/CI/language-metrics.sh --report "${{ runner.temp }}/language-metrics.txt"

      # The development sets are meant to be read; the held-out sets are not.
      # This step prints the first and cannot reach the second: the scorers are
      # named in the script rather than discovered, and it refuses arguments.
      # To the job log, not to a file. The first version of this step wrote
      # the failures to ${{ runner.temp }} and nothing collected them, so the
      # run that asked for them produced nothing anyone could read. The job
      # log is the one place every reader can already see; the artifact host
      # is not reachable from every session.
      # `always()` because the run that most needs the rows is the run that
      # went red: when Measure exits non-zero on a corpus-gate regression,
      # a step without it is skipped and the dispatch produces a count and
      # no rows.
      - name: Development-set failures
        if: always() && inputs.devset_failures == true
        run: Tools/CI/devset-failures.sh || true

      # Which branch answers for the rows `unfinished.tsv:35` declares out of
      # scope. The count in the step above says how many declared rows now pass
      # and names them; it cannot say WHY, and the three reasons a declared row
      # can pass call for opposite edits — one means the id should go, one means
      # it should stay. Only a direct call on the raw string separates them, and
      # `--completion` is that call.
      #
      # Riding on `devset_failures` rather than a switch of its own: the run
      # that wants to know why a declared row passes is the run that asked for
      # the rows. The binary is already built by the gate and by the step above,
      # so this adds no build. `|| true` for the same reason that step has it —
      # a question about a count must never decide whether the run went green.
      - name: Which branch answers the declared limits
        if: always() && inputs.devset_failures == true
        run: |
          [ -x Tools/PipelineProbe/build/probe ] \
            || ./Tools/PipelineProbe/build.sh >/dev/null \
            || { echo "COMPLETION: probe build failed, nothing was asked"; exit 0; }
          ./Tools/PipelineProbe/build/probe --completion \
            Tools/PipelineProbe/questions/declared-limits.txt || true

      - name: Upload the metrics report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: language-metrics
          path: ${{ runner.temp }}/language-metrics.txt
          retention-days: 30
          if-no-files-found: ignore

      # The Foundation Models prototype, after the metrics rather than before
      # them: a compile error in the prototype must not be the reason a
      # dispatch someone paid for produces no language numbers.
      #
      # Two questions, both cheap. Does the prototype still compile against the
      # live sources -- the only compile check it gets, since the unit suite
      # does not run on pull requests. And can the model be reached on this
      # runner at all: `--availability` prints what the framework says rather
      # than assuming, and never fails the job, because "no Apple Intelligence
      # here" is a finding to record, not a broken build. `--selfcheck` is the
      # half that has to pass everywhere, because it needs no model.
      - name: Build the interpretation prototype
        if: always()
        run: Tools/InterpretationProbe/build.sh

      - name: What the Foundation Model reports on this runner
        if: always()
        run: Tools/InterpretationProbe/build/interpret --availability

      - name: Interpretation selfcheck (no model needed)
        if: always()
        run: Tools/InterpretationProbe/build/interpret --selfcheck
