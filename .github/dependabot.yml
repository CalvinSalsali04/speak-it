# Weekly dependency updates for the two Node projects and the pinned actions.
# The iOS app has no package dependencies, so there is nothing to watch there.
version: 2
updates:
  - package-ecosystem: npm
    directory: /FounderDashboard
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      majors:
        update-types: [major]
    ignore:
      # typescript-eslint 8 pins typescript <6.1; lift when it supports 6+.
      - dependency-name: typescript
        versions: [">=6"]
      # eslint-plugin-jsx-a11y 6 caps eslint at ^9; lift with the plugin.
      - dependency-name: eslint
        versions: [">=10"]
      - dependency-name: "@eslint/js"
        versions: [">=10"]
  - package-ecosystem: npm
    directory: /ReferralService
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      majors:
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
